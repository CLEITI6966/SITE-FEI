<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLEITI6966HUBS | HUB</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #5865F2;
            --accent: #00f2ff;
            --bg: #030303;
            --glass: rgba(255, 255, 255, 0.03);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }

        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), #1a1a2e 0%, #030303 50%);
            z-index: -2; transition: 0.1s;
        }

        /* NAVBAR & MENU */
        nav {
            padding: 20px 5%; display: flex; justify-content: space-between; align-items: center;
            position: fixed; width: 100%; top: 0; z-index: 100; backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo { font-family: 'Syncopate'; font-size: 0.6rem; letter-spacing: 5px; color: var(--primary); text-transform: uppercase; }
        
        .menu-icon { cursor: pointer; display: flex; flex-direction: column; gap: 5px; z-index: 1001; }
        .menu-icon div { width: 25px; height: 3px; background: white; transition: 0.3s; }

        .sidebar {
            position: fixed; top: 0; right: -300px; width: 300px; height: 100%;
            background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(20px);
            z-index: 1000; transition: 0.4s; padding: 100px 30px;
            border-left: 1px solid var(--primary);
        }
        .sidebar.active { right: 0; }
        .sidebar-link {
            display: block; color: white; text-decoration: none; font-size: 0.8rem;
            text-transform: uppercase; letter-spacing: 3px; margin-bottom: 30px;
            font-weight: 900; transition: 0.3s; cursor: pointer;
        }
        .sidebar-link:hover { color: var(--primary); padding-left: 10px; }

        /* PÁGINAS */
        .page { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 100px 5%; }
        .active { display: flex; animation: pageZoom 0.5s ease forwards; }

        @keyframes pageZoom { from { opacity: 0; transform: scale(1.1); } to { opacity: 1; transform: scale(1); } }

        /* BYPASS WEBHOOK STYLES */
        .input-box {
            width: 100%; max-width: 500px; background: var(--glass); border: 1px solid rgba(255,255,255,0.1);
            padding: 20px; border-radius: 15px; margin-bottom: 20px; color: white;
            font-family: 'Inter'; outline: none; border: 1px solid var(--primary);
        }
        .code-output {
            width: 100%; max-width: 500px; background: #000; color: #00ff00;
            padding: 20px; border-radius: 10px; font-family: monospace; font-size: 0.7rem;
            overflow-x: auto; white-space: pre-wrap; margin-top: 20px; display: none;
            border: 1px dashed #333; position: relative;
        }
        .copy-btn { margin-top: 10px; display: none; background: #333; font-size: 0.6rem; }

        /* CARDS E GRIDS */
        .discord-card {
            background: var(--glass); border: 1px solid rgba(255,255,255,0.1);
            padding: 40px; border-radius: 30px; text-align: center; width: 100%; max-width: 420px;
            backdrop-filter: blur(20px); transition: var(--transition); margin-bottom: 40px;
        }
        .btn {
            background: var(--primary); color: white; padding: 14px 35px; border-radius: 12px;
            text-decoration: none; font-weight: 900; font-size: 0.8rem; transition: 0.3s;
            display: inline-block; border: none; text-transform: uppercase; cursor: pointer;
        }
        .btn:hover { background: #fff; color: var(--primary); transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="bg-glow" id="glow"></div>

    <nav>
        <div class="logo">CLEITI6966HUBS</div>
        <div class="menu-icon" onclick="toggleMenu()">
            <div></div><div></div><div></div>
        </div>
    </nav>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-link" onclick="go('home')">Início</div>
        <div class="sidebar-link" onclick="go('webhook')">Burlar Webhook</div>
        <div class="sidebar-link" onclick="go('mc')">Minecraft</div>
        <div class="sidebar-link" onclick="go('piano')">Roblox</div>
        <div class="sidebar-link" onclick="go('boot')">Dual Boot</div>
    </div>

    <section id="home" class="page active">
        <div class="discord-card">
            <h1 id="srv-name" style="font-size: 1.3rem;">CARREGANDO...</h1>
            <div class="status-real">
                <span id="online-now">0</span> Online | <span id="total-members">0</span> Membros
            </div>
            <br>
            <a href="https://discord.gg/Nm8wABP5RN" target="_blank" class="btn" onclick="playClick()">ENTRAR</a>
        </div>
    </section>

    <section id="webhook" class="page">
        <h2 style="letter-spacing: 5px; margin-bottom: 20px;">BURLAR WEBHOOK</h2>
        <input type="text" id="webhook-link" class="input-box" placeholder="Cole o link do Webhook aqui...">
        <button class="btn" onclick="generateBypass()">Gerar Código Ghost</button>
        
        <div id="code-output" class="code-output"></div>
        <button id="copy-btn" class="btn copy-btn" onclick="copyCode()">COPIAR CÓDIGO</button>
    </section>

    <section id="mc" class="page">
        <div class="btn" onclick="go('home')">VOLTAR</div>
    </section>

    <audio id="start-sound" src="https://github.com/CLEITI6966/SITE-FEI/raw/refs/heads/main/amoung-us.mp3"></audio>
    <audio id="click-sound" src="https://github.com/CLEITI6966/SITE-FEI/raw/refs/heads/main/gemi2-01.mp3"></audio>

    <script>
        const startAudio = document.getElementById('start-sound');
        const clickAudio = document.getElementById('click-sound');

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            playClick();
        }

        function playClick() {
            clickAudio.currentTime = 0;
            clickAudio.play();
        }

        function go(id) {
            playClick();
            document.getElementById('sidebar').classList.remove('active');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function generateBypass() {
            const link = document.getElementById('webhook-link').value;
            if(!link.includes("discord.com/api/webhooks")) {
                alert("Link inválido!");
                return;
            }
            playClick();
            
            const code = `-- Ghost Webhook System
local url = "${link}"
local req = (fluxus and fluxus.request) or (syn and syn.request) or http_request or request

if req then
    req({
        Url = url,
        Method = "POST",
        Headers = {["Content-Type"] = "application/json"},
        Body = game:GetService("HttpService"):JSONEncode({content = "BYPASS EXECUTED"})
    })
    print("Enviado!")
else
    print("Executor não suportado")
end`;

            const output = document.getElementById('code-output');
            output.innerText = code;
            output.style.display = 'block';
            document.getElementById('copy-btn').style.display = 'inline-block';
        }

        function copyCode() {
            const text = document.getElementById('code-output').innerText;
            navigator.clipboard.writeText(text);
            alert("Código copiado!");
            playClick();
        }

        // Mouse Glow
        document.addEventListener('mousemove', e => {
            const glow = document.getElementById('glow');
            glow.style.setProperty('--x', e.clientX + 'px');
            glow.style.setProperty('--y', e.clientY + 'px');
        });

        // Som ao iniciar
        window.addEventListener('click', () => {
            if (startAudio.paused) startAudio.play().catch(() => {});
        }, { once: true });

        // Discord API
        async function fetchRealData() {
            try {
                const res = await fetch('https://discord.com/api/v9/invites/Nm8wABP5RN?with_counts=true');
                const data = await res.json();
                if(data.guild) {
                    document.getElementById('srv-name').innerText = data.guild.name.toUpperCase();
                    document.getElementById('online-now').innerText = data.approximate_presence_count;
                    document.getElementById('total-members').innerText = data.approximate_member_count;
                }
            } catch (e) {}
        }
        fetchRealData();
    </script>
</body>
</html>
