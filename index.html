<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLEITI6966HUBS | HUB</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #5865F2;
            --accent: #00f2ff;
            --bg: #030303;
            --glass: rgba(255, 255, 255, 0.03);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }

        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), #1a1a2e 0%, #030303 50%);
            z-index: -2; transition: 0.1s;
        }

        nav {
            padding: 20px 5%; display: flex; justify-content: space-between; align-items: center;
            position: fixed; width: 100%; top: 0; z-index: 100; backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo { font-family: 'Syncopate'; font-size: 0.6rem; letter-spacing: 5px; color: var(--primary); text-transform: uppercase; }

        .page { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 100px 5%; }
        .active { display: flex; animation: pageZoom 0.5s ease forwards; }

        @keyframes pageZoom { from { opacity: 0; transform: scale(1.1); } to { opacity: 1; transform: scale(1); } }

        .discord-card {
            background: var(--glass); border: 1px solid rgba(255,255,255,0.1);
            padding: 40px; border-radius: 30px; text-align: center; width: 100%; max-width: 420px;
            backdrop-filter: blur(20px); transition: var(--transition); margin-bottom: 40px;
            position: relative; overflow: hidden;
        }
        .discord-card:hover { border-color: var(--primary); transform: translateY(-10px) scale(1.02); }

        .server-img { width: 100px; height: 100px; border-radius: 25px; margin-bottom: 15px; border: 2px solid var(--primary); box-shadow: 0 0 20px rgba(88,101,242,0.4); }

        .status-real { display: flex; justify-content: center; gap: 30px; margin: 25px 0; }
        .count-box { display: flex; flex-direction: column; }
        .count-num { font-size: 1.8rem; font-weight: 900; color: #fff; }
        .count-label { font-size: 0.6rem; text-transform: uppercase; color: var(--primary); letter-spacing: 2px; }

        .btn {
            background: var(--primary); color: white; padding: 14px 35px; border-radius: 12px;
            text-decoration: none; font-weight: 900; font-size: 0.8rem; transition: 0.3s;
            display: inline-block; border: none; text-transform: uppercase; cursor: pointer;
        }
        .btn:hover { background: #fff; color: var(--primary); transform: scale(1.1); box-shadow: 0 0 30px rgba(255,255,255,0.5); }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; width: 100%; max-width: 900px; }
        .opt {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08);
            padding: 40px; border-radius: 20px; cursor: pointer; transition: var(--transition); text-align: center;
        }
        .opt:hover { background: var(--primary); transform: translateY(-5px); }
        .opt h2 { font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; }

        .dl-row {
            background: rgba(255,255,255,0.03); width: 100%; max-width: 600px; padding: 25px;
            border-radius: 20px; margin-bottom: 15px; display: flex; justify-content: space-between;
            align-items: center; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s;
        }
        .dl-row:hover { background: rgba(255,255,255,0.08); border-color: var(--primary); }

        .back { cursor: pointer; color: var(--primary); font-size: 0.7rem; font-weight: 900; margin-bottom: 30px; letter-spacing: 4px; }
    </style>
</head>
<body>

    <div class="bg-glow" id="glow"></div>

    <nav>
        <div class="logo">CLEITI6966HUBS</div>
    </nav>

    <section id="home" class="page active">
        <div class="discord-card">
            <img id="srv-icon" src="https://raw.githubusercontent.com/CLEITI6966/HUB/refs/heads/main/IMG_20251225_145843.png" class="server-img" alt="Server">
            <h1 id="srv-name" style="font-size: 1.3rem; letter-spacing: 2px;">CARREGANDO...</h1>
            
            <div class="status-real">
                <div class="count-box">
                    <span class="count-num" id="online-now">0</span>
                    <span class="count-label">Online</span>
                </div>
                <div class="count-box">
                    <span class="count-num" id="total-members">0</span>
                    <span class="count-label">Membros</span>
                </div>
            </div>
            
            <a href="https://discord.gg/EvV2nWCwBa" target="_blank" class="btn" onclick="playClick()">ENTRAR NO SERVIDOR</a>
        </div>

        <div class="grid">
            <div class="opt" onclick="go('mc')"><h2>Minecraft</h2></div>
            <div class="opt" onclick="go('piano')"><h2>Roblox</h2></div>
            <div class="opt" onclick="go('boot')"><h2>Dual Boot</h2></div>
        </div>
    </section>

    <section id="mc" class="page">
        <div class="back" onclick="go('home')">← VOLTAR AO INÍCIO</div>
        <div class="dl-row"><span>Instalador Cleiti FULL</span><a href="https://www.mediafire.com/file/kpsaysvi2qxr968/Instalador_Cleiti6966hubs_FULL.exe/file" target="_blank" class="btn" onclick="playClick()">DOWNLOAD</a></div>
        <div class="dl-row"><span>Site Auxiliar (TXT)</span><a href="https://www.mediafire.com/file/wnpb94ojoqlgcmg/site+1.txt/file" target="_blank" class="btn" onclick="playClick()">DOWNLOAD</a></div>
    </section>

    <section id="piano" class="page">
        <div class="back" onclick="go('home')">← VOLTAR AO INÍCIO</div>
        <div class="dl-row"><span>AutoHotKey</span><a href="https://www.autohotkey.com/" target="_blank" class="btn" onclick="playClick()">SITE</a></div>
        <div class="dl-row"><span>Piano Script .ahk</span><a href="https://www.mediafire.com/file/03rgl6jpok5irvw/Piano_AUTO_PLAY.ahk/file" target="_blank" class="btn" onclick="playClick()">DOWNLOAD</a></div>
    </section>

    <section id="boot" class="page">
        <div class="back" onclick="go('home')">← VOLTAR AO INÍCIO</div>
        <div class="dl-row"><span>EasyBCD v2.4</span><a href="https://easybcd.org/Download-EasyBCD" target="_blank" class="btn" onclick="playClick()">DOWNLOAD</a></div>
        <div class="dl-row"><span>Wimlib 1.14.4</span><a href="https://wimlib.net/downloads/wimlib-1.14.4-windows-x86_64-bin.zip" target="_blank" class="btn" onclick="playClick()">DOWNLOAD</a></div>
    </section>

    <audio id="click-sound" src="https://github.com/CLEITI6966/SITE-FEI/raw/refs/heads/main/gemi2-01.mp3"></audio>

    <script>
        const clickAudio = document.getElementById('click-sound');

        function playClick() {
            clickAudio.currentTime = 0;
            clickAudio.play();
        }

        // Efeito do mouse no fundo
        document.addEventListener('mousemove', e => {
            const glow = document.getElementById('glow');
            glow.style.setProperty('--x', e.clientX + 'px');
            glow.style.setProperty('--y', e.clientY + 'px');
        });

        // Função para navegar entre as páginas
        function go(id) {
            playClick();
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
        }

        // Busca dados do Discord (ID atualizado para EvV2nWCwBa)
        async function fetchRealData() {
            try {
                const res = await fetch('https://discord.com/api/v9/invites/EvV2nWCwBa?with_counts=true');
                const data = await res.json();
                
                if(data.guild) {
                    document.getElementById('srv-name').innerText = data.guild.name.toUpperCase();
                    document.getElementById('online-now').innerText = data.approximate_presence_count;
                    document.getElementById('total-members').innerText = data.approximate_member_count;
                }
            } catch (e) {
                console.log("Erro ao carregar API");
            }
        }

        fetchRealData();
        setInterval(fetchRealData, 20000);
    </script>
</body>
</html>
